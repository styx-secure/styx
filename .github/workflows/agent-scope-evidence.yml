name: Agent scope evidence

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
      - edited

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

concurrency:
  group: ${{ github.repository }}-agent-scope-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scope-evidence:
    name: Agent scope evidence (observation)
    # Styx contract-task branches only (task/<N>-*). Two exclusions, both
    # deliberate: PRs from non-task branches (dependabot, fix/*, feat/*)
    # carry no Styx task contract; MUCC story branches (task/US-*) reference
    # Issues that carry MUCC-generated projections, not Styx v1 contracts
    # (namespace separation, docs/governance/mucc-migration/ruleset-proposal.md).
    # Either would fail with E_CI_ISSUE_REFERENCE_MISSING/INVALID; skipping
    # lets this check stay a required status check without blocking them.
    if: startsWith(github.head_ref, 'task/') && !startsWith(github.head_ref, 'task/US-')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate immutable workflow identity
        shell: bash
        run: |
          set -euo pipefail
          readonly sha_pattern='^[0-9a-f]{40}$'
          if [[ ! "${GITHUB_SHA:-}" =~ $sha_pattern ]]; then
            echo "::error::GITHUB_SHA is not a lowercase full 40-hex SHA"
            exit 3
          fi
          if [[ ! "${GITHUB_WORKFLOW_SHA:-}" =~ $sha_pattern ]]; then
            echo "::error::GITHUB_WORKFLOW_SHA is not a lowercase full 40-hex SHA"
            exit 3
          fi
          if [[ "$GITHUB_SHA" != "$GITHUB_WORKFLOW_SHA" ]]; then
            echo "::error::workflow identity witness does not match GITHUB_SHA"
            exit 3
          fi

      - name: Checkout trusted workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
          lfs: false
          submodules: false

      - name: Run trusted-tool scope observation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STYX_REPORT_PATH: ${{ runner.temp }}/styx-task-scope-report.json
          STYX_RESULT_PATH: ${{ runner.temp }}/styx-scope-exit-code.txt
        shell: bash
        run: |
          set +e
          python3 tools/agent-enforcement/ci_adapter.py run \
            --event-file "$GITHUB_EVENT_PATH" \
            --repo "$GITHUB_WORKSPACE" \
            --runner-temp "$RUNNER_TEMP" \
            --repository "$GITHUB_REPOSITORY" \
            --api-url "$GITHUB_API_URL" \
            --server-url "$GITHUB_SERVER_URL" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --trusted-tool-sha "$GITHUB_SHA" \
            --workflow-sha "$GITHUB_WORKFLOW_SHA" \
            --report "$STYX_REPORT_PATH"
          observation_code=$?
          set -e
          case "$observation_code" in
            0|2|3) ;;
            *) observation_code=3 ;;
          esac
          printf '%s\n' "$observation_code" > "$STYX_RESULT_PATH"

      - name: Upload canonical scope report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: styx-scope-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/styx-task-scope-report.json
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 9
          overwrite: false
          include-hidden-files: false

      - name: Write safe job summary
        if: always()
        env:
          STYX_REPORT_PATH: ${{ runner.temp }}/styx-task-scope-report.json
          STYX_RESULT_PATH: ${{ runner.temp }}/styx-scope-exit-code.txt
        shell: bash
        run: |
          set +e
          if [[ -f tools/agent-enforcement/ci_adapter.py ]]; then
            python3 tools/agent-enforcement/ci_adapter.py summarize \
              --report "$STYX_REPORT_PATH" \
              --summary "$GITHUB_STEP_SUMMARY"
            summary_code=$?
          else
            printf '%s\n' \
              '## Styx scope evidence' \
              '' \
              '**ERROR** — trusted CI adapter is unavailable.' \
              >> "$GITHUB_STEP_SUMMARY"
            summary_code=3
          fi
          set -e
          if [[ "$summary_code" -ne 0 && "$summary_code" -ne 2 && "$summary_code" -ne 3 ]]; then
            summary_code=3
          fi
          if [[ "$summary_code" -eq 3 ]]; then
            printf '3\n' > "$STYX_RESULT_PATH"
          fi

      - name: Conclude observation
        if: always()
        env:
          STYX_RESULT_PATH: ${{ runner.temp }}/styx-scope-exit-code.txt
        shell: bash
        run: |
          if [[ ! -f "$STYX_RESULT_PATH" ]]; then
            exit 3
          fi
          observation_code="$(cat "$STYX_RESULT_PATH")"
          case "$observation_code" in
            0|2|3) exit "$observation_code" ;;
            *) exit 3 ;;
          esac
