<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <link rel="icon" href="data:,">
    <title>Styx B2.5b isolated browser harness</title>
    <script type="importmap">
      {"imports":{
        "@noble/hashes/sha256":"/node_modules/@noble/hashes/esm/sha256.js",
        "@noble/hashes/crypto":"/node_modules/@noble/hashes/esm/crypto.js",
        "@noble/hashes/utils":"/node_modules/@noble/hashes/esm/utils.js",
        "@noble/curves/secp256k1":"/node_modules/@noble/curves/esm/secp256k1.js",
        "@noble/hashes/":"/node_modules/@noble/hashes/esm/",
        "@noble/curves/":"/node_modules/@noble/curves/esm/"
      }}
    </script>
  </head>
  <body>
    <p>STYX_SPIKE_PROTOTYPE — not a product path</p>
    <script type="module">
      import { schnorr } from '@noble/curves/secp256k1.js';
      import initOpenMls, * as wasm from '../../vendor/openmls-wasm/openmls_wasm.js';
      import {
        B25B_LOCAL_STATE, bytesToHex, copyBytes, digestHex,
      } from './b2-5b-canonical.mjs';
      import { openB25BJournal } from './b2-5b-journal.mjs';
      import { createB25BCoordinator } from './b2-5b-coordinator.mjs';

      await initOpenMls({ module_or_path: new URL(
        '../../vendor/openmls-wasm/openmls_wasm_bg.wasm', import.meta.url,
      ) });

      const UTF8 = new TextEncoder();
      const GROUP = Uint8Array.from({ length: 32 }, (_, index) => index + 1);
      const GROUP_HEX = bytesToHex(GROUP);
      const actors = new Map();

      function free(value) { try { value?.free?.(); } catch { /* probe cleanup */ } }

      function proof(privateKey, signatureKey, createdAt) {
        const account = Uint8Array.from(schnorr.getPublicKey(privateKey));
        const event = [0, bytesToHex(account), createdAt, 450, [
          ['d', 'marmot.account-identity-proof.v2'], ['component', '0x8009'],
          ['ciphersuite', '0x0001'], ['signature_scheme', '0x0807'],
          ['mls_signature_key', bytesToHex(signatureKey)],
        ], 'Authorize this MLS leaf key for my Marmot account'];
        const signature = Uint8Array.from(schnorr.sign(
          Uint8Array.from(digestHex(UTF8.encode(JSON.stringify(event)))
            .match(/../g).map((byte) => Number.parseInt(byte, 16))),
          privateKey,
        ));
        const bytes = new Uint8Array(104);
        bytes.set(account, 0);
        new DataView(bytes.buffer).setBigUint64(32, BigInt(createdAt));
        bytes.set(signature, 40);
        return { account, bytes };
      }

      function peer(provider, seed) {
        const privateKey = new Uint8Array(32);
        privateKey[31] = seed;
        const account = Uint8Array.from(schnorr.getPublicKey(privateKey));
        const identity = new wasm.PhaseB2Identity(provider, account);
        const signatureKey = copyBytes(identity.leaf_signature_key());
        const identityProof = proof(privateKey, signatureKey, 1_786_435_200 + seed).bytes;
        const generated = identity.key_package(provider, identityProof);
        const framed = copyBytes(generated.to_framed_bytes());
        free(generated);
        const keyPackage = wasm.PhaseB2KeyPackage.from_framed_bytes(framed);
        return { account, identity, signatureKey, identityProof, keyPackage };
      }

      async function initialize(actor) {
        const entry = actors.get(actor);
        const aliceProvider = new wasm.Provider();
        const bobProvider = new wasm.Provider();
        const alice = peer(aliceProvider, 1);
        const bob = peer(bobProvider, 2);
        const group = wasm.PhaseB2Group.create_new(
          aliceProvider, alice.identity, GROUP, alice.identityProof,
        );
        const pending = group.prepare_add(aliceProvider, alice.identity, bob.keyPackage);
        const projection = pending.projection();
        try {
          group.confirm_pending(aliceProvider, pending, projection.verified_leaf_digest());
          await entry.coordinator.initializeStable({
            snapshotBytes: copyBytes(aliceProvider.serialize_state()), groupId: GROUP,
            accountKey: alice.account, signatureKey: alice.signatureKey,
          });
        } finally {
          for (const value of [projection, pending, group, alice.keyPackage, alice.identity,
            bob.keyPackage, bob.identity, aliceProvider, bobProvider]) free(value);
        }
      }

      function outcome(promise) {
        return promise.then((value) => ({ ok: true, value }))
          .catch((error) => ({ ok: false, code: error?.code, message: String(error) }));
      }

      globalThis.B25BHarness = Object.freeze({
        groupIdHex: GROUP_HEX,
        async open(actor, tag) {
          const journal = await openB25BJournal({ databaseTag: tag });
          const gate = { armed: false, entered: false, release: null, promise: null };
          const coordinator = createB25BCoordinator({ journal, wasm, beforeCandidate: async () => {
            if (!gate.armed) return;
            gate.entered = true;
            await gate.promise;
          } });
          actors.set(actor, { journal, coordinator, gate, pendingResolve: null });
        },
        initialize,
        async prepare(actor) {
          const { coordinator } = actors.get(actor);
          await coordinator.queueSelfUpdate(GROUP_HEX);
          return coordinator.runQueuedOpportunity(GROUP_HEX);
        },
        attempt(actor) { return actors.get(actor).coordinator.recordAttempt(GROUP_HEX); },
        async acknowledge(actor) {
          const { journal, coordinator } = actors.get(actor);
          const local = await journal.readLocal(GROUP_HEX);
          return coordinator.recordAcknowledgement(
            GROUP_HEX, local.publishAttempts, local.recipientScope[0], UTF8.encode('browser-ack'),
          );
        },
        freeze(actor) { return actors.get(actor).coordinator.freeze(GROUP_HEX); },
        async read(actor) {
          const { journal } = actors.get(actor);
          return { head: (await journal.readHead(GROUP_HEX)).head,
            local: await journal.readLocal(GROUP_HEX),
            publication: await journal.readPublication(GROUP_HEX) };
        },
        armResolution(actor) {
          const { gate } = actors.get(actor);
          gate.armed = true;
          gate.entered = false;
          gate.promise = new Promise((resolve) => { gate.release = resolve; });
        },
        startResolution(actor, digest) {
          const entry = actors.get(actor);
          entry.pendingResolve = outcome(entry.coordinator.resolve(digest));
        },
        resolutionEntered(actor) { return actors.get(actor).gate.entered; },
        releaseResolution(actor) { actors.get(actor).gate.release?.(); },
        resolutionResult(actor) { return actors.get(actor).pendingResolve; },
        localStates: B25B_LOCAL_STATE,
        close(actor) { actors.get(actor)?.journal.close(); actors.delete(actor); },
        async destroy(actor) { await actors.get(actor)?.journal.destroy(); actors.delete(actor); },
      });
    </script>
  </body>
</html>
