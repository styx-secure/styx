[package]
name = "styx-b3-mdk-peer"
version = "0.0.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"

[dependencies]
async-trait = "0.1"
cgka-engine = { git = "https://github.com/marmot-protocol/mdk.git", rev = "3fb4b4759ac676b0c21c4c3527074866c9fa4c89", features = ["test-conformance-snapshot"] }
cgka-traits = { git = "https://github.com/marmot-protocol/mdk.git", rev = "3fb4b4759ac676b0c21c4c3527074866c9fa4c89" }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
storage-sqlite = { git = "https://github.com/marmot-protocol/mdk.git", rev = "3fb4b4759ac676b0c21c4c3527074866c9fa4c89" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
